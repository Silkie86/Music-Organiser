name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build MusicOrganiser.sln -c Release
      - run: dotnet test tests/MusicOrganiser.Core.Tests -c Release --no-build

  # Core (readers, writers, library, Sound Lab), the shared view models and the Avalonia app
  # must keep building, and the tests passing, on macOS and Linux.
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/MusicOrganiser.Core.Tests -c Release
      - run: dotnet build src/MusicOrganiser.Avalonia -c Release
