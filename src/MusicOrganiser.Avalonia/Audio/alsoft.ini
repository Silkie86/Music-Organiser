# OpenAL Soft's settings for Music Organiser. OpenAL Soft reads this file from the app's own folder when sound
# first plays (Windows only for now: a Mac or Linux would want it as alsoft.conf, not yet tried there).
#
# It's read after the user's own %AppData%\alsoft.ini, so for these two settings it wins over theirs (any other
# setting they made still applies), and it applies whichever way OpenAL reaches the speakers, not only WASAPI.
#
# Its default keeps 60 ms of mixed sound queued ahead of Windows (3 periods of 20 ms), so a sound started in the
# galaxy reached the speakers 60 ms after the app asked for it, plus Windows' and the audio interface's own delay.
# Two periods of 10 ms is what most audio apps use in Windows' shared mode: about 20 ms queued.
# If sound ever crackles on a busy computer, set periods = 3 (30 ms).
[general]
period_size = 480
periods = 2
